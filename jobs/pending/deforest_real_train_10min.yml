schema_version: 1
job_id: deforest-real-train-10min
task: train
class_name: deforest
priority: 100
description: "First real CPU-only deforest training smoke on S3 Kanopus scenes."

params:
  model:
    name: tiny_unet_4ch
    in_channels: 4
    out_channels: 1
    input_bands: [1, 2, 3, 4]
    preview_bands: [4, 1, 2]
  seed: 42

data:
  images_uri: s3://mlsystems/images/
  layout_uri: s3://mlsystems/layouts/deforest/
  scenes_file: scenes.txt
  annotation_file: auto
  scene_name_matching: fuzzy
  include_negative_scenes: true

preprocess:
  tile_size: 1024
  stride: 768
  max_nodata_fraction: 0.35
  max_empty_tile_share: 0.5
  cache: true
  heavy_cache_backend: s3

train:
  enabled: true
  time_limit_sec: 600
  workers: 0
  batch_size: auto
  patch_size: 256
  epochs: 20
  max_train_tiles: 24
  max_val_tiles: 8
  max_tiles_per_scene: 4
  learning_rate: 0.0005
  optimizer: adamw
  loss:
    - weighted_bce
    - dice
  augmentations:
    flips: true
    rot90: true

eval:
  enabled: true
  thresholds: [0.3, 0.4, 0.5, 0.6, 0.7]
  metrics:
    - dice
    - iou
    - precision
    - recall
    - f1

resources:
  requires_gpu: false
  cpu_train_slots: 1
  cpu_preprocess_slots: 0
  workers: 0

mlflow:
  experiment: mlsystem-deforest
  tags:
    run_name: train:deforest-real-train-10min
    job_kind: real_train
    data_source: s3

outputs:
  codex_summary: true
  sync_results_to_repo: true
