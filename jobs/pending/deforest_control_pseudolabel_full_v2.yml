schema_version: 1
job_id: deforest_control_pseudolabel_full_v2
task: predict
class_name: deforest
priority: 200
description: Control full-scene pseudolabel run v2 with scene matching report and parallel CPU inference.
params:
  debug_pseudolabel: true
  input_bands: [1, 2, 3, 4]
  preview_bands: [4, 1, 2]
  seed: 20427
  use_all_matched_scenes: true
  selected_checkpoint_reason: "Best available prior summary by best_val_iou: deforest_exp04_r34_t512, best_val_iou=0.44836788483030987."
  model:
    name: unet_resnet34
    input_bands: [1, 2, 3, 4]
    in_channels: 4
    out_channels: 1
data:
