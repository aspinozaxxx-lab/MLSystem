      enabled: true
      strategy: scene
      max_workers: 2
      torch_threads_per_worker: 4
      max_ram_gb: 48
  pseudolabel:
    enabled: true
    debug: true
    full_scene: true
    run_on: matched_scenes
    use_all_matched_scenes: true
    checkpoint_path: /data/mlsystem/storage/experiments/deforest_exp04_r34_t512__20260425T202857249530Z/unet_resnet34.pt
postprocess:
  enabled: true
  auto_tune: false
  max_geojson_mb: 20
  max_objects: 500
  min_object_area_m2_candidates: [2000]
  simplify_tolerance_m_candidates: [10]
  thresholds: [0.55]
  keep_largest_if_too_many: true
  export:
    geojson: true
    geojson_gz: true
    gpkg: true
resources:
  requires_gpu: false
  cpu_train_slots: 0
  cpu_preprocess_slots: 1
  workers: 0
mlflow:
  experiment: mlsystem-deforest
  tags:
    run_label: CTRL-pseudo-v2
    model_name: unet_resnet34
    tile_size: "2048"
    stride: "2048"
    pseudolabel_enabled: "true"
    control_run: "true"
    bug_area: pseudolabel_tiling
    inference_parallel_enabled: "true"
    inference_max_workers: "2"
    torch_threads_per_worker: "4"
