schema_version: 1
job_id: mlflow_ui_smoke
task: train
class_name: deforest
priority: 10
description: "Lightweight MLflow UI integration smoke: compact run name, notes, epoch table, system metrics."
params:
  smoke_train: true
  model:
    name: unet_resnet18
    in_channels: 4
    out_channels: 1
    input_bands: [1, 2, 3, 4]
    preview_bands: [4, 1, 2]
data:
  images_uri: s3://mlsystems/images/
  layout_uri: s3://mlsystems/layouts/deforest/
  scenes_file: scenes.txt
  annotation_file: auto
  scene_name_matching: fuzzy
  include_negative_scenes: true
preprocess:
  tile_size: 512
  stride: 384
train:
  smoke: true
  enabled: true
  epochs: 3
  epoch_sleep_sec: 2.0
  time_limit_sec: 60
  workers: 0
  batch_size: 1
  learning_rate: 0.001
predict:
  pseudolabel:
    enabled: false
postprocess:
  enabled: false
resources:
  requires_gpu: false
  cpu_train_slots: 1
  workers: 0
mlflow:
  experiment: mlsystem-deforest
  tags:
    run_label: SMK-r18-t512
    model_name: unet_resnet18
    tile_size: "512"
    stride: "384"
    pseudolabel_enabled: "false"
    postprocess_profile: smoke
