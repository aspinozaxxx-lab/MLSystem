schema_version: 1
job_id: deforest-train-predict-template
task: train_predict_pseudolabel
class_name: deforest
priority: 200
description: Production job template. Heavy execution is intentionally not implemented/enabled in MVP.
params:
  enabled: false
  reason: CPU-only server; use as schema template only until train executor is approved.
data:
  images_ref: s3://ml-datasets/deforest/images/
  layout_ref: s3://ml-datasets/deforest/layouts/main/
preprocess:
  tile_size: 512
  stride: 256
  cache_policy: reuse_by_hash
train:
  model: unet_resnet34
  epochs: 1
  batch_size: 1
  time_limit_minutes: 5
  disabled: true
predict:
  save_probability_maps: false
postprocess:
  export_pseudolabels: true
  disabled: true
resources:
  requires_gpu: false
  cpu_train_slots: 1
  cpu_preprocess_slots: 1
  workers: 0
mlflow:
  experiment: deforest
  tags:
    pipeline: train_predict_pseudolabel
    safety: heavy-disabled
