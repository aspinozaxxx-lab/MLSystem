schema_version: 1
project_root: /home/worker/mlsystem
storage_root: /home/worker/mlsystem/storage
logs_root: /home/worker/mlsystem/logs
mlflow:
  tracking_uri_internal: http://127.0.0.1:5000
  tracking_uri_external: http://172.26.12.169:5000
  default_experiment: mlsystem
s3_endpoint_url: http://127.0.0.1:9000
s3_alias: mlplatform
artifact_bucket: mlsystems
dataset_cache_bucket: mlsystems
storage:
  heavy_backend: s3
  s3_bucket: mlsystems
  s3_prefix: ""
s3_paths:
  images: s3://mlsystems/images/
  layouts: s3://mlsystems/layouts/
  datasets: s3://mlsystems/datasets/
  cache: s3://mlsystems/cache/
  models: s3://mlsystems/models/
  predictions: s3://mlsystems/predictions/
  pseudolabels: s3://mlsystems/pseudolabels/
  reports: s3://mlsystems/reports/
  experiments: s3://mlsystems/experiments/
  system: s3://mlsystems/system/
s3_write_test_enabled: false
s3_test_bucket: null
cpu_only: true
max_gpu_train_jobs: 0
max_cpu_train_jobs: 1
max_cpu_preprocess_jobs: 1
default_workers: 0
known_data_roots:
  - /home/worker/ml-training/data/raw
  - /home/worker/ml-training/data/cog
  - /home/worker/ml-training/data/labels
  - /home/worker/ml-training/models
max_inventory_files: 2000
max_inventory_depth: 5
preprocess_interval_sec: 300
disk_warning_free_gb: 20
recent_jobs_limit: 20
web:
  host: 0.0.0.0
  port: 8010
