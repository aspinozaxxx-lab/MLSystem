[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsystem-inference-engine"
version = "0.1.0"
description = "MLSystem pseudolabel InferenceEngine service"
requires-python = ">=3.11"
dependencies = [
  "aio-pika>=9.4,<10",
  "affine>=2.4",
  "boto3>=1.34",
  "fastapi>=0.111",
  "mlflow>=2.12",
  "numpy>=1.26",
  "pydantic>=2.8",
  "rasterio>=1.3",
  "requests>=2.32",
  "shapely>=2.0",
  "tritonclient[http]>=2.45",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
inference-engine-worker = "inference_engine.workers.cli:main"
