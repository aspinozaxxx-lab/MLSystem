<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MLSystem{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">MLSystem</a>
    <nav class="nav">
      <a href="/annotation-check">Проверка разметок</a>
      <form method="post" action="/logout">
        <button type="submit" class="link-button">Выйти</button>
      </form>
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
