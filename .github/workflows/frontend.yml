name: frontend

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "ansible/roles/frontend/**"
      - "ansible/playbooks/deploy_frontend.yml"
      - "deploy/docker-compose.gpu.yml"
      - ".github/workflows/frontend.yml"
      - "docs/frontend.md"
      - "README.md"
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "ansible/roles/frontend/**"
      - "ansible/playbooks/deploy_frontend.yml"
      - "deploy/docker-compose.gpu.yml"
      - ".github/workflows/frontend.yml"
      - "docs/frontend.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: mlsystem-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r frontend/requirements.txt

      - name: Run frontend tests
        run: python -m unittest discover -s frontend/tests

      - name: Compile frontend
        run: python -m compileall -q frontend

      - name: Check whitespace
        run: git diff --check

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t mlsystem-frontend:${GITHUB_SHA} .

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) }}
    env:
      GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
      GPU_SERVER_USER: ${{ secrets.GPU_SERVER_USER }}
      MLSYSTEM_FRONTEND_USER: ${{ secrets.MLSYSTEM_FRONTEND_USER }}
      MLSYSTEM_FRONTEND_PASSWORD: ${{ secrets.MLSYSTEM_FRONTEND_PASSWORD }}
      MLSYSTEM_FRONTEND_SESSION_SECRET: ${{ secrets.MLSYSTEM_FRONTEND_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required deployment secrets
        run: |
          missing=0
          for name in GPU_SERVER_HOST GPU_SERVER_USER; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: ${name}" >&2
              missing=1
            fi
          done
          if [ -z "${{ secrets.GPU_SERVER_SSH_KEY }}" ]; then
            echo "Missing GitHub secret: GPU_SERVER_SSH_KEY" >&2
            missing=1
          fi
          exit "$missing"

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible-core PyYAML
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure SSH inventory
        run: |
          mkdir -p ~/.ssh
          umask 077
          cat > ~/.ssh/gpu_server_key <<'KEY'
          ${{ secrets.GPU_SERVER_SSH_KEY }}
          KEY
          sed -i 's/^          //' ~/.ssh/gpu_server_key
          ssh-keyscan -H "$GPU_SERVER_HOST" >> ~/.ssh/known_hosts
          cat > ansible/inventory/gpu-ci.ini <<EOF
          [gpu_mlserver]
          gpu-mlserver ansible_host=${GPU_SERVER_HOST} ansible_user=${GPU_SERVER_USER} ansible_ssh_private_key_file=$HOME/.ssh/gpu_server_key ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Check frontend playbook syntax
        run: ansible-playbook -i ansible/inventory/gpu-ci.ini ansible/playbooks/deploy_frontend.yml --syntax-check

      - name: Deploy frontend
        run: ansible-playbook -i ansible/inventory/gpu-ci.ini ansible/playbooks/deploy_frontend.yml

  validate-frontend:
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: ${{ needs.deploy-frontend.result == 'success' }}
    env:
      GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
      GPU_SERVER_USER: ${{ secrets.GPU_SERVER_USER }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          cat > ~/.ssh/gpu_server_key <<'KEY'
          ${{ secrets.GPU_SERVER_SSH_KEY }}
          KEY
          sed -i 's/^          //' ~/.ssh/gpu_server_key
          ssh-keyscan -H "$GPU_SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Validate frontend deployment
        run: |
          SSH="ssh -i ~/.ssh/gpu_server_key -o StrictHostKeyChecking=yes ${GPU_SERVER_USER}@${GPU_SERVER_HOST}"
          $SSH "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep mlsystem-gpu-frontend"
          $SSH "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep mlsystem-gpu-frontend-proxy"
          $SSH "sudo ss -ltnp | egrep ':(80|8090|8088)\s' || true"
          $SSH "curl -fsS http://127.0.0.1:8090/health | python3 -m json.tool"
          $SSH "curl -fsS -I http://127.0.0.1:8090/login"
          $SSH "curl -fsS http://127.0.0.1/health | python3 -m json.tool"
          $SSH "curl -fsS -I http://127.0.0.1/login"
          $SSH "curl -fsS http://127.0.0.1:8088/ready >/dev/null"
          $SSH "docker exec mlsystem-gpu-frontend python -c \"import os, urllib.request; base=os.environ.get('MLSYSTEM_API_BASE_URL','http://mlsystem-api:8088'); print(urllib.request.urlopen(base + '/ready', timeout=5).status)\""
          python -c "import urllib.request; urls=['http://31.192.104.147/health','http://31.192.104.147/login','http://31.192.104.147/']; [print('checking', u) or (lambda r: (print(r.status, r.geturl()), (_ for _ in ()).throw(AssertionError(r.status)) if not (200 <= r.status < 400) else None))(urllib.request.urlopen(u, timeout=15)) for u in urls]"
