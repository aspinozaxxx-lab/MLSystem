name: enqueue-jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "jobs/pending/**/*.yml"
      - "jobs/pending/**/*.yaml"

permissions:
  contents: read

concurrency:
  group: mlsystem-enqueue
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Validate pending jobs
        run: |
          /home/worker/ml-training/.venv/bin/python - <<'PY'
          from pathlib import Path
          import sys, yaml
          sys.path.insert(0, str(Path("mlsystem").resolve()))
          from src.job_schema import JobSpec
          files = sorted(Path("jobs/pending").glob("**/*.yml")) + sorted(Path("jobs/pending").glob("**/*.yaml"))
          for path in files:
              JobSpec.model_validate(yaml.safe_load(path.read_text(encoding="utf-8")) or {})
              print(f"ok {path}")
          print(f"pending_jobs={len(files)}")
          PY

      - name: Copy jobs into server queue
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(jobs/pending/**/*.yml jobs/pending/**/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No pending job files to enqueue"
            exit 0
          fi
          cd /home/worker/mlsystem
          for file in "${files[@]}"; do
            /home/worker/ml-training/.venv/bin/python -m src.cli enqueue "$GITHUB_WORKSPACE/$file"
          done
