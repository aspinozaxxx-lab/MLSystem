name: cicd-code

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mlsystem/**"
      - "mlsystem/**/*"
      - "mlsystem/*.md"
      - "configs/**"
      - ".github/workflows/cicd-code.yml"

permissions:
  contents: read

concurrency:
  group: mlsystem-cicd-code
  cancel-in-progress: false

jobs:
  code:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Ansible is available
        run: |
          if command -v ansible-playbook >/dev/null 2>&1; then
            ansible-playbook --version
          else
            /home/worker/ml-training/.venv/bin/python -m pip install ansible-core
            echo "/home/worker/ml-training/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Compile Python
        run: /home/worker/ml-training/.venv/bin/python -m compileall -q mlsystem/src

      - name: Validate configs
        run: |
          /home/worker/ml-training/.venv/bin/python - <<'PY'
          from pathlib import Path
          import sys, yaml
          sys.path.insert(0, str(Path("mlsystem").resolve()))
          from src.pipeline_config import PipelineConfig
          from src.job_schema import JobSpec

          config_path = Path("mlsystem/configs/pipeline.server.yaml")
          PipelineConfig.model_validate(yaml.safe_load(config_path.read_text(encoding="utf-8")) or {})
          JobSpec.model_validate(yaml.safe_load(Path("mlsystem/configs/job.example.yaml").read_text(encoding="utf-8")) or {})
          print("configs ok")
          PY

      - name: Scan for obvious secrets
        run: |
          /home/worker/ml-training/.venv/bin/python - <<'PY'
          from pathlib import Path
          import re, sys
          patterns = [
              ("github token", re.compile(r"\b(?:ghp|gho|ghu|ghs|github_pat)_[A-Za-z0-9_]{20,}\b")),
              ("aws access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("private key", re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----")),
              ("secret assignment", re.compile(r"(?i)\b(?:aws_secret_access_key|minio_secret_key|secret_access_key|runner_registration_token)\s*[:=]\s*['\"]?[A-Za-z0-9/+=]{16,}")),
          ]
          ignored_dirs = {".git", ".venv", "venv", "__pycache__"}
          findings = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored_dirs for part in path.parts):
                  continue
              if path.stat().st_size > 1_000_000:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if "$" + "{{ secrets." in line:
                      continue
                  for name, pattern in patterns:
                      if pattern.search(line):
                          findings.append(f"{path}:{line_no}: {name}")
          if findings:
              print("\n".join(findings))
              sys.exit(1)
          print("secret scan ok")
          PY

      - name: Check code deploy playbook syntax
        run: ansible-playbook -i 'localhost,' -c local ansible/playbooks/deploy_code.yml --syntax-check

      - name: Deploy application code
        run: ansible-playbook -i 'localhost,' -c local ansible/playbooks/deploy_code.yml -e mlsystem_manage_services=false

      - name: Validate services
        run: |
          systemctl is-active mlsystem-web.service
          systemctl is-active mlsystem-executor.service
          if systemctl list-unit-files mlsystem-preprocess.service --no-legend | grep -q mlsystem-preprocess.service; then
            systemctl is-active mlsystem-preprocess.service
          fi
          curl -fsS http://127.0.0.1:8010/api/state | /home/worker/ml-training/.venv/bin/python -m json.tool
          curl -fsS http://127.0.0.1:8010/api/preprocess | /home/worker/ml-training/.venv/bin/python -m json.tool
