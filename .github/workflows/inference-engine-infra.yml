name: InferenceEngine infra

on:
  pull_request:
    paths:
      - "ansible/**"
      - "deploy/**"
      - "InferenceEngine/Dockerfile"
      - ".github/workflows/inference-engine-infra.yml"
  push:
    branches: [main, master]
    paths:
      - "ansible/**"
      - "deploy/**"
      - "InferenceEngine/Dockerfile"
      - ".github/workflows/inference-engine-infra.yml"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, apply]
        default: check
      bootstrap:
        type: boolean
        default: false

concurrency:
  group: inference-engine-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible and YAML tools
        run: python -m pip install ansible pyyaml
      - name: Parse YAML
        run: |
          python - <<'PY'
          import pathlib, yaml
          for path in list(pathlib.Path("ansible").rglob("*.yml")) + list(pathlib.Path(".github/workflows").glob("inference-engine-*.yml")):
              yaml.safe_load(path.read_text())
          PY
      - name: Ansible syntax check
        run: |
          ansible-playbook -i ansible/inventory/gpu.ini --syntax-check ansible/playbooks/deploy_ml_platform.yml
          ansible-playbook -i ansible/inventory/gpu.ini --syntax-check ansible/playbooks/deploy_triton.yml
          ansible-playbook -i ansible/inventory/gpu.ini --syntax-check ansible/playbooks/deploy_inference_engine.yml
          ansible-playbook -i ansible/inventory/gpu.ini --syntax-check ansible/playbooks/deploy_rabbitmq.yml

  plan-or-check:
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compose env file
        run: |
          sudo mkdir -p /etc/mlsystem
          sudo tee /etc/mlsystem/gpu-platform.env >/dev/null <<'EOF'
          MINIO_ROOT_USER=minio
          MINIO_ROOT_PASSWORD=miniosecret
          MLFLOW_DB_PASSWORD=mlflowsecret
          RABBITMQ_DEFAULT_USER=mlsystem
          RABBITMQ_DEFAULT_PASS=rabbitsecret
          INFERENCE_ENGINE_API_TOKEN=ietoken
          INFERENCE_ENGINE_RABBITMQ_URL=amqp://mlsystem:rabbitsecret@rabbitmq:5672/
          MLSYSTEM_API_TOKEN=api-token
          EOF
      - name: Validate compose config
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: miniosecret
          MLFLOW_DB_PASSWORD: mlflowsecret
          RABBITMQ_DEFAULT_USER: mlsystem
          RABBITMQ_DEFAULT_PASS: rabbitsecret
          RABBITMQ_MANAGEMENT_LISTEN_HOST: 127.0.0.1
          INFERENCE_ENGINE_API_TOKEN: ietoken
          INFERENCE_ENGINE_RABBITMQ_URL: amqp://mlsystem:rabbitsecret@rabbitmq:5672/
          MLSYSTEM_API_TOKEN: api-token
        run: docker compose -f deploy/docker-compose.gpu.yml config >/tmp/compose.yml
      - name: Verify RabbitMQ and InferenceEngine service definitions
        run: |
          grep -q "rabbitmq:" /tmp/compose.yml
          grep -q "inference-engine-api:" /tmp/compose.yml
          grep -q "inference-engine-triton-worker:" /tmp/compose.yml
          grep -q "inference-engine-merger:" /tmp/compose.yml

  apply-infra:
    runs-on: ubuntu-latest
    needs: plan-or-check
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply')
    concurrency:
      group: mlsystem-gpu-server-${{ github.ref }}
      cancel-in-progress: false
    env:
      GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
      GPU_SERVER_USER: ${{ secrets.GPU_SERVER_USER }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
      MLSYSTEM_API_TOKEN: ${{ secrets.MLSYSTEM_API_TOKEN }}
      RABBITMQ_DEFAULT_USER: ${{ secrets.RABBITMQ_DEFAULT_USER }}
      RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS }}
      INFERENCE_ENGINE_API_TOKEN: ${{ secrets.INFERENCE_ENGINE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required deployment secrets
        run: |
          missing=0
          for name in GPU_SERVER_HOST GPU_SERVER_USER; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: ${name}" >&2
              missing=1
            fi
          done
          if [ -z "${{ secrets.GPU_SERVER_SSH_KEY }}" ]; then
            echo "Missing GitHub secret: GPU_SERVER_SSH_KEY" >&2
            missing=1
          fi
          exit "$missing"
      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible-core PyYAML
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure SSH inventory
        run: |
          mkdir -p ~/.ssh
          umask 077
          cat > ~/.ssh/gpu_server_key <<'KEY'
          ${{ secrets.GPU_SERVER_SSH_KEY }}
          KEY
          sed -i 's/^          //' ~/.ssh/gpu_server_key
          ssh-keyscan -H "$GPU_SERVER_HOST" >> ~/.ssh/known_hosts
          cat > ansible/inventory/gpu-ci.ini <<EOF
          [gpu_mlserver]
          gpu-mlserver ansible_host=${GPU_SERVER_HOST} ansible_user=${GPU_SERVER_USER} ansible_ssh_private_key_file=$HOME/.ssh/gpu_server_key ansible_python_interpreter=/usr/bin/python3 ansible_ssh_common_args='-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes'
          EOF
      - name: Apply RabbitMQ and InferenceEngine infra
        run: ansible-playbook -i ansible/inventory/gpu-ci.ini ansible/playbooks/deploy_inference_engine.yml -e "mlsystem_git_commit=${GITHUB_SHA}"

  validate-infra:
    runs-on: ubuntu-latest
    needs: apply-infra
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply')
    concurrency:
      group: mlsystem-gpu-server-${{ github.ref }}
      cancel-in-progress: false
    env:
      GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
      GPU_SERVER_USER: ${{ secrets.GPU_SERVER_USER }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          cat > ~/.ssh/gpu_server_key <<'KEY'
          ${{ secrets.GPU_SERVER_SSH_KEY }}
          KEY
          sed -i 's/^          //' ~/.ssh/gpu_server_key
          ssh-keyscan -H "$GPU_SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Validate deployed infra
        run: |
          SSH="ssh -i ~/.ssh/gpu_server_key -o StrictHostKeyChecking=yes ${GPU_SERVER_USER}@${GPU_SERVER_HOST}"
          $SSH "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
          RABBIT_USER="$($SSH "awk -F= '/^RABBITMQ_DEFAULT_USER=/{print substr(\$0,index(\$0,\"=\")+1)}' /etc/mlsystem/gpu-platform.env")"
          RABBIT_PASS="$($SSH "awk -F= '/^RABBITMQ_DEFAULT_PASS=/{print substr(\$0,index(\$0,\"=\")+1)}' /etc/mlsystem/gpu-platform.env")"
          $SSH "curl -fsS -u '${RABBIT_USER}:${RABBIT_PASS}' http://127.0.0.1:15672/rabbitmq/api/overview >/tmp/rabbitmq-overview.json"
          $SSH "test \"\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:15672/rabbitmq/api/overview)\" = \"401\""
          $SSH "docker exec mlsystem-gpu-rabbitmq rabbitmqctl list_queues name messages_ready messages_unacknowledged consumers"
          $SSH "for i in \$(seq 1 60); do curl -fsS http://127.0.0.1:8095/health && exit 0; sleep 5; done; exit 1"
          $SSH "for i in \$(seq 1 60); do curl -fsS http://127.0.0.1:8095/ready && exit 0; sleep 5; done; exit 1"
          $SSH "curl -fsS http://127.0.0.1:8095/queues"
          $SSH "curl -fsS http://127.0.0.1:8095/metrics"
          $SSH "curl -fsS http://127.0.0.1:8000/v2/health/ready"
          COMPOSE="docker compose --env-file /etc/mlsystem/gpu-platform.env -f /data/mlsystem/platform/docker-compose.yml"
          $SSH "$COMPOSE exec -T mlsystem-api python -c \"import urllib.request; urllib.request.urlopen('http://inference-engine-api:8095/health', timeout=5)\""
