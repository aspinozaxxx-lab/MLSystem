name: validate-jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "jobs/pending/**/*.yml"
      - "jobs/pending/**/*.yaml"
      - "jobs/examples/**/*.yml"
      - "jobs/examples/**/*.yaml"
      - ".github/workflows/validate-jobs.yml"
  pull_request:
    branches: [main]
    paths:
      - "jobs/**/*.yml"
      - "jobs/**/*.yaml"
      - ".github/workflows/validate-jobs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pydantic PyYAML

      - name: Validate job YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys, yaml
          sys.path.insert(0, str(Path("mlsystem").resolve()))
          from src.job_schema import JobSpec

          files = []
          for root in (Path("jobs/examples"), Path("jobs/pending")):
              files.extend(sorted(root.glob("**/*.yml")))
              files.extend(sorted(root.glob("**/*.yaml")))

          for path in files:
              payload = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
              JobSpec.model_validate(payload)
              print(f"ok job {path}")
          print(f"validated_jobs={len(files)}")
          PY
