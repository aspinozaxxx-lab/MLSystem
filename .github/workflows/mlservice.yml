name: mlservice

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: check
      deploy:
        type: boolean
        default: false
      validate:
        type: boolean
        default: true
      run_real_validation:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mlsystem-mlservice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            PyYAML pydantic fastapi uvicorn requests mlflow boto3 numpy shapely pyproj rasterio pillow \
            onnx onnxscript tritonclient[http] segmentation-models-pytorch pytest

      - name: Run unit tests
        run: |
          python -m pytest \
            tests/test_architecture_boundaries.py \
            tests/test_train_pipeline_config.py \
            tests/test_train_pipeline_run_store.py \
            tests/test_train_pipeline_status.py \
            tests/test_train_pipeline_worker.py \
            tests/test_inference_pipeline_api.py \
            tests/test_inference_pipeline_contracts.py \
            tests/test_inference_pipeline_fastapi.py \
            tests/test_train_api.py \
            tests/test_train_losses.py \
            tests/test_train_model_factory.py \
            tests/test_train_loop_smoke.py \
            tests/test_segmentation_metrics.py \
            tests/test_object_metrics.py

      - name: Compile Python modules
        run: python -m compileall -q mlsystem tests

      - name: Check whitespace
        run: git diff --check

      - name: Validate stage contracts
        run: |
          python - <<'PY'
          from mlsystem.src.train_pipeline.config import DEFAULT_PIPELINE_STAGES
          from mlsystem.src.train_pipeline.stages import STAGE_POOLS
          print("stages", len(DEFAULT_PIPELINE_STAGES))
          missing = [stage for stage in DEFAULT_PIPELINE_STAGES if stage not in STAGE_POOLS]
          assert not missing, missing
          PY
          python - <<'PY'
          from mlsystem.src.train_pipeline.stages.registry import known_stages
          print("registry_stages", known_stages())
          PY

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Record service build metadata
        run: |
          mkdir -p build
          printf '%s\n' "${GITHUB_SHA}" > build/mlsystem_commit.txt
          tar --exclude='.git' --exclude='build' -czf build/mlsystem-service-source.tgz \
            mlsystem tests README.md docs configs scripts

      - uses: actions/upload-artifact@v4
        with:
          name: mlsystem-service-source
          path: |
            build/mlsystem_commit.txt
            build/mlsystem-service-source.tgz

  deploy-mlservice:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.deploy || inputs.mode == 'deploy' || inputs.mode == 'apply' }}
    concurrency:
      group: mlsystem-gpu-server
      cancel-in-progress: false
    env:
      GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
      GPU_SERVER_USER: ${{ secrets.GPU_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required deployment secrets
        run: |
          missing=0
          for name in GPU_SERVER_HOST GPU_SERVER_USER; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: ${name}" >&2
              missing=1
            fi
          done
          if [ -z "${{ secrets.GPU_SERVER_SSH_KEY }}" ]; then
            echo "Missing GitHub secret: GPU_SERVER_SSH_KEY" >&2
            missing=1
          fi
          exit "$missing"

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible-core PyYAML
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure SSH inventory
        run: |
          mkdir -p ~/.ssh
          umask 077
          cat > ~/.ssh/gpu_server_key <<'KEY'
          ${{ secrets.GPU_SERVER_SSH_KEY }}
          KEY
          sed -i 's/^          //' ~/.ssh/gpu_server_key
          ssh-keyscan -H "$GPU_SERVER_HOST" >> ~/.ssh/known_hosts
          cat > ansible/inventory/gpu-ci.ini <<EOF
          [gpu_mlserver]
          gpu-mlserver ansible_host=${GPU_SERVER_HOST} ansible_user=${GPU_SERVER_USER} ansible_ssh_private_key_file=$HOME/.ssh/gpu_server_key ansible_python_interpreter=/usr/bin/python3 ansible_ssh_common_args='-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes'
          EOF

      - name: Check service deploy playbook syntax
        run: ansible-playbook -i ansible/inventory/gpu-ci.ini ansible/playbooks/deploy_mlsystem_code.yml --syntax-check

      - name: Deploy MLSystem service code
        run: ansible-playbook -i ansible/inventory/gpu-ci.ini ansible/playbooks/deploy_mlsystem_code.yml -e "mlsystem_git_commit=${GITHUB_SHA}"

  validate-service:
    runs-on: ubuntu-latest
    needs: deploy-mlservice
    if: ${{ inputs.validate && needs.deploy-mlservice.result == 'success' }}
    concurrency:
      group: mlsystem-gpu-server
      cancel-in-progress: false
    env:
      GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
      GPU_SERVER_USER: ${{ secrets.GPU_SERVER_USER }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          cat > ~/.ssh/gpu_server_key <<'KEY'
          ${{ secrets.GPU_SERVER_SSH_KEY }}
          KEY
          sed -i 's/^          //' ~/.ssh/gpu_server_key
          ssh-keyscan -H "$GPU_SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Validate MLSystem service deployment
        run: |
          SSH="ssh -i ~/.ssh/gpu_server_key -o StrictHostKeyChecking=yes ${GPU_SERVER_USER}@${GPU_SERVER_HOST}"
          $SSH "curl -fsS http://127.0.0.1:8088/health | python3 -m json.tool"
          commit="$($SSH "python3 - <<'PY'
          import json, urllib.request
          print(json.load(urllib.request.urlopen('http://127.0.0.1:8088/health')).get('commit'))
          PY")"
          test "$commit" != "unknown"
          test "$commit" = "$GITHUB_SHA"
          $SSH "curl -fsS http://127.0.0.1:8088/ready | python3 -m json.tool"
          COMPOSE="docker compose --env-file /etc/mlsystem/gpu-platform.env -f /data/mlsystem/platform/docker-compose.yml"
          stages="$($SSH "curl -fsS http://127.0.0.1:8088/api/v1/stages")"
          echo "$stages" | python3 -m json.tool
          STAGES_JSON="$stages" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ["STAGES_JSON"])
          main = set(data.get("pipeline_stages") or [])
          registry = set(data.get("registry_stages") or [])
          assert "train_model" in main, main
          assert "prepare_dataset" in main, main
          assert "inventory_scenes" in registry, registry
          old = {
              "prepare_inference_scenes",
              "run_pseudolabel_inference",
              "validate_probability_maps",
              "vectorize_pseudolabel",
              "postprocess_pseudolabel",
              "export_pseudolabel_artifacts",
          }
          assert not (old & main), old & main
          assert not (old & registry), old & registry
          PY
          $SSH "cd /opt/mlsystem/repo && timeout 600 python3 scripts/smoke_pipeline_api_no_airflow.py --api http://127.0.0.1:8088 --token-file /etc/mlsystem/gpu-platform.env --dry-run --poll-sec 10 --out /tmp/mlsystem-pipeline-smoke.json"
          $SSH "cat /tmp/mlsystem-pipeline-smoke.json"

      - name: Optional real MLSystem validation
        if: ${{ inputs.run_real_validation }}
        run: |
          SSH="ssh -i ~/.ssh/gpu_server_key -o StrictHostKeyChecking=yes ${GPU_SERVER_USER}@${GPU_SERVER_HOST}"
          $SSH "cd /opt/mlsystem/repo && timeout 3600 python3 scripts/smoke_pipeline_api_no_airflow.py --api http://127.0.0.1:8088 --token-file /etc/mlsystem/gpu-platform.env --dry-run --real-train --poll-sec 30 --train-timeout-sec 1800 --out /tmp/mlsystem-pipeline-real-smoke.json"
          $SSH "cat /tmp/mlsystem-pipeline-real-smoke.json"

  summary:
    runs-on: ubuntu-latest
    needs: [test, build, deploy-mlservice, validate-service]
    if: ${{ always() }}
    steps:
      - name: Write workflow summary
        run: |
          {
            echo "### MLSystem service workflow"
            echo
            echo "- mode: ${{ inputs.mode }}"
            echo "- deploy: ${{ inputs.deploy }}"
            echo "- validate: ${{ inputs.validate }}"
            echo "- test: ${{ needs.test.result }}"
            echo "- build: ${{ needs.build.result }}"
            echo "- deploy-mlservice: ${{ needs.deploy-mlservice.result }}"
            echo "- validate-service: ${{ needs.validate-service.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
