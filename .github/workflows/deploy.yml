name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mlsystem/**"
      - "ansible/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: mlsystem-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Ansible is available
        run: |
          if command -v ansible-playbook >/dev/null 2>&1; then
            ansible-playbook --version
          else
            /home/worker/ml-training/.venv/bin/python -m pip install ansible-core
            echo "/home/worker/ml-training/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Deploy mlsystem to server
        run: |
          ansible-playbook -i 'localhost,' -c local ansible/playbooks/deploy.yml \
            -e mlsystem_manage_services=true

      - name: Validate deployed services
        run: |
          systemctl is-active mlsystem-web.service
          systemctl is-active mlsystem-executor.service
          curl -fsS http://127.0.0.1:8010/api/state | /home/worker/ml-training/.venv/bin/python -m json.tool
          curl -fsS http://127.0.0.1:5000 >/dev/null
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null

      - name: Write deploy summary
        run: |
          mkdir -p results/summaries
          /home/worker/ml-training/.venv/bin/python - <<'PY' | tee results/summaries/deploy-summary.json
          import json, os, socket
          from datetime import datetime, timezone
          payload = {
              "schema_version": 1,
              "type": "deploy",
              "status": "done",
              "server": "roskadastr-ml",
              "source_sha": os.environ.get("GITHUB_SHA"),
              "runner_host": socket.gethostname(),
              "finished_at": datetime.now(timezone.utc).isoformat(),
          }
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
          {
            echo "## MLSystem deploy"
            echo
            echo "- Server: roskadastr-ml"
            echo "- Source SHA: ${GITHUB_SHA}"
            echo "- Web API: http://127.0.0.1:8010/api/state"
            echo "- Services: mlsystem-web.service, mlsystem-executor.service"
          } >> "$GITHUB_STEP_SUMMARY"
