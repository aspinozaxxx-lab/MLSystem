name: frontend-site

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "docs/frontend.md"
      - ".github/workflows/frontend-site.yml"
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "docs/frontend.md"
      - ".github/workflows/frontend-site.yml"

permissions:
  contents: read

concurrency:
  group: frontend-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r frontend/requirements.txt

      - name: Run frontend tests
        run: python -m unittest discover -s frontend/tests

      - name: Compile frontend
        run: python -m compileall -q frontend

      - name: Check whitespace
        run: git diff --check

  deploy-site:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) }}
    env:
      GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
      GPU_SERVER_USER: ${{ secrets.GPU_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required deployment secrets
        run: |
          missing=0
          for name in GPU_SERVER_HOST GPU_SERVER_USER; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: ${name}" >&2
              missing=1
            fi
          done
          if [ -z "${{ secrets.GPU_SERVER_SSH_KEY }}" ]; then
            echo "Missing GitHub secret: GPU_SERVER_SSH_KEY" >&2
            missing=1
          fi
          exit "$missing"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          cat > ~/.ssh/gpu_server_key <<'KEY'
          ${{ secrets.GPU_SERVER_SSH_KEY }}
          KEY
          sed -i 's/^          //' ~/.ssh/gpu_server_key
          ssh-keyscan -H "$GPU_SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Sync frontend source
        run: |
          SSH="ssh -i ~/.ssh/gpu_server_key -o StrictHostKeyChecking=yes"
          TARGET="${GPU_SERVER_USER}@${GPU_SERVER_HOST}"
          $SSH "$TARGET" "mkdir -p /opt/mlsystem/repo/frontend /opt/mlsystem/repo/docs"
          rsync -az --delete -e "$SSH" frontend/ "$TARGET:/opt/mlsystem/repo/frontend/"
          rsync -az -e "$SSH" docs/frontend.md "$TARGET:/opt/mlsystem/repo/docs/frontend.md"

      - name: Rebuild and restart frontend service
        run: |
          SSH="ssh -i ~/.ssh/gpu_server_key -o StrictHostKeyChecking=yes ${GPU_SERVER_USER}@${GPU_SERVER_HOST}"
          COMPOSE="docker compose --env-file /etc/mlsystem/gpu-platform.env -f /data/mlsystem/platform/docker-compose.yml"
          $SSH "$COMPOSE up -d --build --force-recreate --no-deps mlsystem-frontend mlsystem-frontend-proxy"

  validate-site:
    runs-on: ubuntu-latest
    needs: deploy-site
    if: ${{ needs.deploy-site.result == 'success' }}
    env:
      GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
      GPU_SERVER_USER: ${{ secrets.GPU_SERVER_USER }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          cat > ~/.ssh/gpu_server_key <<'KEY'
          ${{ secrets.GPU_SERVER_SSH_KEY }}
          KEY
          sed -i 's/^          //' ~/.ssh/gpu_server_key
          ssh-keyscan -H "$GPU_SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Validate frontend site
        run: |
          SSH="ssh -i ~/.ssh/gpu_server_key -o StrictHostKeyChecking=yes ${GPU_SERVER_USER}@${GPU_SERVER_HOST}"
          $SSH "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep mlsystem-gpu-frontend"
          $SSH "curl -fsS http://127.0.0.1:8090/health | python3 -m json.tool"
          $SSH "curl -fsS http://127.0.0.1/health | python3 -m json.tool"
          $SSH "curl -fsS -I http://127.0.0.1/login"
          python - <<'PY'
          import urllib.request
          for url in ("http://31.192.104.147/health", "http://31.192.104.147/login", "http://31.192.104.147/"):
              print("checking", url)
              with urllib.request.urlopen(url, timeout=15) as response:
                  print(response.status, response.geturl())
                  assert 200 <= response.status < 400
          PY
