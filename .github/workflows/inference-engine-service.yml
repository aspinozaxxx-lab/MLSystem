name: InferenceEngine service

on:
  pull_request:
    paths:
      - "InferenceEngine/**"
      - "mlsystem/**"
      - "airflow/**"
      - "tests/**"
      - ".github/workflows/inference-engine-service.yml"
  push:
    branches: [main, master]
    paths:
      - "InferenceEngine/**"
      - "mlsystem/**"
      - "airflow/**"
      - "tests/**"
      - ".github/workflows/inference-engine-service.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      INFERENCE_ENGINE_JOB_ROOT: /tmp/inference-engine/jobs
      INFERENCE_ENGINE_SPOOL_ROOT: /tmp/inference-engine/spool
      INFERENCE_ENGINE_ARTIFACT_ROOT: /tmp/inference-engine/artifacts
      INFERENCE_ENGINE_LOGS_ROOT: /tmp/inference-engine/logs
      INFERENCE_ENGINE_USE_RABBITMQ: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e InferenceEngine
          pip install fastapi uvicorn shapely rasterio affine numpy pydantic pika aio-pika tritonclient[http] mlflow boto3 requests httpx
      - name: Run InferenceEngine unit tests
        run: python -m unittest discover -s InferenceEngine/tests
      - name: Run repository unit tests
        run: python -m unittest discover -s tests
      - name: Compile
        run: python -m compileall -q InferenceEngine mlsystem airflow tests
      - name: Validate queue contracts
        run: python -c "from InferenceEngine.src.inference_engine.queues.messages import validate_queue_contracts; print(validate_queue_contracts())"
      - name: Whitespace check
        run: git diff --check

  build-artifact:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build source artifact
        run: tar -czf inference-engine-service.tar.gz InferenceEngine mlsystem docs scripts
      - uses: actions/upload-artifact@v4
        with:
          name: inference-engine-service
          path: inference-engine-service.tar.gz

  deploy-service-code:
    runs-on: ubuntu-latest
    needs: build-artifact
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    env:
      GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
      GPU_SERVER_USER: ${{ secrets.GPU_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required deployment secrets
        run: |
          missing=0
          for name in GPU_SERVER_HOST GPU_SERVER_USER; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: ${name}" >&2
              missing=1
            fi
          done
          if [ -z "${{ secrets.GPU_SERVER_SSH_KEY }}" ]; then
            echo "Missing GitHub secret: GPU_SERVER_SSH_KEY" >&2
            missing=1
          fi
          exit "$missing"
      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible-core PyYAML
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure SSH inventory
        run: |
          mkdir -p ~/.ssh
          umask 077
          cat > ~/.ssh/gpu_server_key <<'KEY'
          ${{ secrets.GPU_SERVER_SSH_KEY }}
          KEY
          sed -i 's/^          //' ~/.ssh/gpu_server_key
          ssh-keyscan -H "$GPU_SERVER_HOST" >> ~/.ssh/known_hosts
          cat > ansible/inventory/gpu-ci.ini <<EOF
          [gpu_mlserver]
          gpu-mlserver ansible_host=${GPU_SERVER_HOST} ansible_user=${GPU_SERVER_USER} ansible_ssh_private_key_file=$HOME/.ssh/gpu_server_key ansible_python_interpreter=/usr/bin/python3
          EOF
      - name: Check deploy playbook syntax
        run: ansible-playbook -i ansible/inventory/gpu-ci.ini ansible/playbooks/deploy_inference_engine_code.yml --syntax-check
      - name: Deploy InferenceEngine code
        run: ansible-playbook -i ansible/inventory/gpu-ci.ini ansible/playbooks/deploy_inference_engine_code.yml -e "mlsystem_git_commit=${GITHUB_SHA}"

  validate-service:
    runs-on: ubuntu-latest
    needs: deploy-service-code
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    env:
      GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
      GPU_SERVER_USER: ${{ secrets.GPU_SERVER_USER }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          cat > ~/.ssh/gpu_server_key <<'KEY'
          ${{ secrets.GPU_SERVER_SSH_KEY }}
          KEY
          sed -i 's/^          //' ~/.ssh/gpu_server_key
          ssh-keyscan -H "$GPU_SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Validate service endpoints and synthetic job
        run: |
          SSH="ssh -i ~/.ssh/gpu_server_key -o StrictHostKeyChecking=yes ${GPU_SERVER_USER}@${GPU_SERVER_HOST}"
          $SSH "for i in \$(seq 1 60); do curl -fsS http://127.0.0.1:8095/health && exit 0; sleep 5; done; exit 1"
          $SSH "for i in \$(seq 1 60); do curl -fsS http://127.0.0.1:8095/ready && exit 0; sleep 5; done; exit 1"
          $SSH "for i in \$(seq 1 60); do curl -fsS http://127.0.0.1:8095/queues && exit 0; sleep 5; done; exit 1"
          $SSH "curl -fsS http://127.0.0.1:8095/metrics"
          TOKEN="$($SSH "awk -F= '/^INFERENCE_ENGINE_API_TOKEN=/{print substr(\$0,index(\$0,\"=\")+1)}' /etc/mlsystem/gpu-platform.env")"
          $SSH "cd /opt/mlsystem/repo && INFERENCE_ENGINE_API_TOKEN='${TOKEN}' timeout 240 python3 scripts/handtest_inference_engine_synthetic.py --api http://127.0.0.1:8095"
