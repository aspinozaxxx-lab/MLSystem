global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: dcgm-exporter
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: triton
    static_configs:
      - targets: ["triton:8002"]

  - job_name: inference-engine
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["inference-engine-api:8095"]

  - job_name: mlsystem-monitor-exporter
    static_configs:
      - targets: ["mlsystem-monitor-exporter:9200"]
