---
- name: Deploy MLflow platform
  hosts: all
  gather_facts: false
  roles:
    - role: mlplatform

- name: Deploy MLSystem lightweight code
  hosts: all
  gather_facts: false
  vars:
    mlsystem_root: /home/worker/mlsystem
    mlsystem_deploy_code: true
    mlsystem_deploy_infra: true
    mlsystem_manage_services: false
    mlsystem_run_health_checks: true
  roles:
    - role: mlsystem
