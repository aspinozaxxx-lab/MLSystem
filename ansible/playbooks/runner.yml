---
- name: Audit GitHub self-hosted runner
  hosts: mlservers
  gather_facts: true
  vars:
    runner_dir: /home/worker/actions-runner
    runner_service: actions.runner.aspinozaxxx-lab-MLSystem.roskadastr-ml.service
  tasks:
    - name: Check runner directory
      ansible.builtin.stat:
        path: "{{ runner_dir }}"
      register: runner_dir_state

    - name: Check runner configuration marker
      ansible.builtin.stat:
        path: "{{ runner_dir }}/.runner"
      register: runner_config_state
      when: runner_dir_state.stat.exists

    - name: Check runner systemd service
      ansible.builtin.command: "systemctl is-active {{ runner_service }}"
      register: runner_service_state
      changed_when: false
      failed_when: false

    - name: Report runner status
      ansible.builtin.debug:
        msg:
          note: "Runner registration is intentionally manual because GitHub uses a temporary registration token."
          runner_dir_exists: "{{ runner_dir_state.stat.exists }}"
          runner_configured: "{{ runner_config_state.stat.exists | default(false) }}"
          runner_service: "{{ runner_service_state.stdout | default('unknown') }}"
          manual_setup_doc: "docs/server_setup.md"
