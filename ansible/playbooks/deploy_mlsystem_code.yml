---
- name: Deploy MLSystem code to GPU server
  hosts: gpu_mlserver
  gather_facts: false
  become: true
  tasks:
    - name: Ensure rsync is installed on target
      ansible.builtin.apt:
        name: rsync
        state: present
        update_cache: true

    - name: Ensure repo parent exists
      ansible.builtin.file:
        path: "{{ mlsystem_gpu_repo_root | dirname }}"
        state: directory
        mode: "0755"

    - name: Ensure repo root exists
      ansible.builtin.file:
        path: "{{ mlsystem_gpu_repo_root }}"
        state: directory
        mode: "0755"

    - name: Rsync checked-out repository from controller
      ansible.builtin.command: >-
        rsync -az --delete
        --exclude .git
        --exclude __pycache__
        --exclude .pytest_cache
        --exclude .tmp_*
        --exclude results/reports/synthetic_pseudolabel_smoke
        -e "ssh -o StrictHostKeyChecking=yes{% if ansible_ssh_private_key_file is defined %} -i {{ ansible_ssh_private_key_file }}{% endif %}"
        "{{ playbook_dir }}/../../"
        "{{ ansible_user | default('root') }}@{{ ansible_host | default(inventory_hostname) }}:{{ mlsystem_gpu_repo_root }}/"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Remove Python cache directories from deployed repo
      ansible.builtin.command:
        cmd: find "{{ mlsystem_gpu_repo_root }}" -type d -name __pycache__ -prune -exec rm -rf {} +
      changed_when: false

    - name: Check GPU platform compose file
      ansible.builtin.stat:
        path: "{{ mlsystem_gpu_compose_path }}"
      register: gpu_platform_compose_stat

    - name: Check GPU platform env file
      ansible.builtin.stat:
        path: "{{ mlsystem_gpu_env_path }}"
      register: gpu_platform_env_stat

    - name: Update deployed MLSystem commit marker
      ansible.builtin.lineinfile:
        path: "{{ mlsystem_gpu_env_path }}"
        regexp: "^MLSYSTEM_COMMIT="
        line: "MLSYSTEM_COMMIT={{ mlsystem_git_commit | default('unknown') }}"
        create: false
        mode: "0600"
      when: gpu_platform_env_stat.stat.exists

    - name: Ensure MLSystem API container exists after code deploy
      ansible.builtin.command:
        cmd: >-
          docker compose --env-file "{{ mlsystem_gpu_env_path }}"
          -f "{{ mlsystem_gpu_compose_path }}"
          up -d --no-deps mlsystem-api
      changed_when: true
      when:
        - gpu_platform_compose_stat.stat.exists
        - gpu_platform_env_stat.stat.exists

    - name: Restart MLSystem API to load deployed code
      ansible.builtin.command:
        cmd: >-
          docker compose --env-file "{{ mlsystem_gpu_env_path }}"
          -f "{{ mlsystem_gpu_compose_path }}"
          restart mlsystem-api
      changed_when: true
      when:
        - gpu_platform_compose_stat.stat.exists
        - gpu_platform_env_stat.stat.exists

    - name: Wait for MLSystem API health after code deploy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mlsystem_gpu_api_port }}/health"
        status_code: 200
      retries: 60
      delay: 10
      register: code_deploy_api_health
      until: code_deploy_api_health.status == 200
      when:
        - gpu_platform_compose_stat.stat.exists
        - gpu_platform_env_stat.stat.exists

    - name: Wait for MLSystem API readiness after code deploy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mlsystem_gpu_api_port }}/ready"
        status_code: 200
      retries: 60
      delay: 10
      register: code_deploy_api_ready
      until: code_deploy_api_ready.status == 200
      when:
        - gpu_platform_compose_stat.stat.exists
        - gpu_platform_env_stat.stat.exists

    - name: Ensure Airflow runtime containers exist after API is ready
      ansible.builtin.command:
        cmd: >-
          docker compose --env-file "{{ mlsystem_gpu_env_path }}"
          -f "{{ mlsystem_gpu_compose_path }}"
          up -d --no-deps airflow-webserver airflow-scheduler airflow-triggerer
      changed_when: true
      when:
        - gpu_platform_compose_stat.stat.exists
        - gpu_platform_env_stat.stat.exists

    - name: Restart Airflow runtime containers to load deployed code
      ansible.builtin.command:
        cmd: >-
          docker compose --env-file "{{ mlsystem_gpu_env_path }}"
          -f "{{ mlsystem_gpu_compose_path }}"
          restart airflow-webserver airflow-scheduler airflow-triggerer
      changed_when: true
      when:
        - gpu_platform_compose_stat.stat.exists
        - gpu_platform_env_stat.stat.exists
