---
- name: Disable legacy MLSystem filesystem queue services
  hosts: all
  gather_facts: true
  vars:
    mlsystem_root: /home/worker/mlsystem
    mlsystem_data_root: /data
    mlsystem_backup_root: /data/mlsystem/backups
    legacy_services:
      - mlsystem-executor.service
      - mlsystem-web.service
      - mlsystem-preprocess.service
  tasks:
    - name: Ensure backup root exists
      ansible.builtin.file:
        path: "{{ mlsystem_backup_root }}"
        state: directory
        owner: worker
        group: worker
        mode: "0755"
      become: true

    - name: Check legacy MLSystem root exists
      ansible.builtin.stat:
        path: "{{ mlsystem_root }}"
      register: legacy_root

    - name: Backup legacy MLSystem code/config/log summaries without heavy storage
      ansible.builtin.shell: |
        set -euo pipefail
        ts="$(date -u +%Y%m%dT%H%M%SZ)"
        dest="{{ mlsystem_backup_root }}/mlsystem_legacy_${ts}.tar.gz"
        tar \
          --exclude='./storage' \
          --exclude='./logs' \
          --exclude='./.git' \
          --exclude='./__pycache__' \
          -C "{{ mlsystem_root }}" \
          -czf "$dest" .
        echo "$dest"
      args:
        executable: /bin/bash
      register: legacy_backup
      changed_when: true
      when: legacy_root.stat.exists

    - name: Stop and disable legacy services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ legacy_services }}"
      become: true
      failed_when: false

    - name: Report legacy disable result
      ansible.builtin.debug:
        msg:
          backup: "{{ legacy_backup.stdout | default('skipped') }}"
          disabled_services: "{{ legacy_services }}"
