---
- name: Deploy MLSystem code before Airflow
  hosts: all
  gather_facts: false
  vars:
    mlsystem_root: /home/worker/mlsystem
    mlsystem_deploy_code: true
    mlsystem_deploy_infra: false
    mlsystem_manage_services: false
    mlsystem_run_health_checks: false
  roles:
    - role: mlsystem

- name: Deploy Airflow orchestrator
  hosts: all
  gather_facts: false
  roles:
    - role: airflow
