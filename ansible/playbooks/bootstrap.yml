---
- name: Bootstrap lightweight MLSystem server layout
  hosts: mlservers
  gather_facts: true
  vars:
    mlsystem_root: /home/worker/mlsystem
    mlsystem_venv: /home/worker/ml-training/.venv
    mlsystem_dirs:
      - "{{ mlsystem_root }}"
      - "{{ mlsystem_root }}/configs"
      - "{{ mlsystem_root }}/src"
      - "{{ mlsystem_root }}/logs"
      - "{{ mlsystem_root }}/storage/images"
      - "{{ mlsystem_root }}/storage/layouts"
      - "{{ mlsystem_root }}/storage/jobs/pending"
      - "{{ mlsystem_root }}/storage/jobs/running"
      - "{{ mlsystem_root }}/storage/jobs/done"
      - "{{ mlsystem_root }}/storage/jobs/failed"
      - "{{ mlsystem_root }}/storage/cache"
      - "{{ mlsystem_root }}/storage/experiments"
      - "{{ mlsystem_root }}/storage/system"
  tasks:
    - name: Check training venv
      ansible.builtin.stat:
        path: "{{ mlsystem_venv }}/bin/python"
      register: venv_python

    - name: Stop if expected venv is missing
      ansible.builtin.fail:
        msg: "Expected venv not found: {{ mlsystem_venv }}"
      when: not venv_python.stat.exists

    - name: Create lightweight MLSystem directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ mlsystem_dirs }}"

    - name: Check MLflow tracking server
      ansible.builtin.uri:
        url: http://127.0.0.1:5000
        method: GET
        status_code: [200, 302, 404]
        timeout: 5
      register: mlflow_check
      failed_when: false

    - name: Check MinIO endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:9000/minio/health/live
        method: GET
        status_code: [200, 403]
        timeout: 5
      register: minio_check
      failed_when: false

    - name: Show bootstrap checks
      ansible.builtin.debug:
        msg:
          mlflow_status: "{{ mlflow_check.status | default('unreachable') }}"
          minio_status: "{{ minio_check.status | default('unreachable') }}"
          python: "{{ ansible_python_version }}"
