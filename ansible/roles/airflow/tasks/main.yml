---
- name: Check existing Airflow environment file
  ansible.builtin.stat:
    path: "{{ airflow_env_path }}"
  register: airflow_existing_env_stat
  become: true

- name: Read existing Airflow environment file
  ansible.builtin.slurp:
    path: "{{ airflow_env_path }}"
  register: airflow_existing_env_file
  become: true
  no_log: true
  when: airflow_existing_env_stat.stat.exists

- name: Parse existing Airflow environment values
  ansible.builtin.set_fact:
    airflow_existing_env: "{{ dict((airflow_existing_env_file.content | b64decode | regex_findall('(?m)^([A-Z0-9_]+)=(.*)$'))) }}"
  no_log: true
  when: airflow_existing_env_stat.stat.exists

- name: Generate Airflow Fernet key when missing
  ansible.builtin.command:
    cmd: python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
  register: airflow_generated_fernet_key
  changed_when: false
  no_log: true
  when:
    - airflow_fernet_key | length == 0
    - (airflow_existing_env | default({})).get('AIRFLOW__CORE__FERNET_KEY', '') | length == 0

- name: Resolve Airflow deployment secrets
  ansible.builtin.set_fact:
    airflow_admin_password_resolved: "{{ airflow_admin_password if airflow_admin_password | length > 0 else ((airflow_existing_env | default({})).get('_AIRFLOW_WWW_USER_PASSWORD', lookup('password', '/dev/null length=32 chars=ascii_letters,digits'))) }}"
    airflow_fernet_key_resolved: "{{ airflow_fernet_key if airflow_fernet_key | length > 0 else ((airflow_existing_env | default({})).get('AIRFLOW__CORE__FERNET_KEY', airflow_generated_fernet_key.stdout | default(''))) }}"
    airflow_secret_key_resolved: "{{ airflow_secret_key if airflow_secret_key | length > 0 else ((airflow_existing_env | default({})).get('AIRFLOW__WEBSERVER__SECRET_KEY', lookup('password', '/dev/null length=48 chars=ascii_letters,digits'))) }}"
    airflow_postgres_password_resolved: "{{ airflow_postgres_password if airflow_postgres_password | length > 0 else ((airflow_existing_env | default({})).get('POSTGRES_PASSWORD', lookup('password', '/dev/null length=32 chars=ascii_letters,digits'))) }}"
  no_log: true

- name: Check worker MinIO client config
  ansible.builtin.stat:
    path: /home/worker/.mc/config.json
  register: airflow_worker_mc_config_stat
  no_log: true

- name: Read worker MinIO client config for Airflow S3 credentials
  ansible.builtin.slurp:
    path: /home/worker/.mc/config.json
  register: airflow_worker_mc_config_file
  no_log: true
  when: airflow_worker_mc_config_stat.stat.exists

- name: Parse worker MinIO client alias
  ansible.builtin.set_fact:
    airflow_worker_mc_alias: "{{ ((airflow_worker_mc_config_file.content | b64decode | from_json).aliases | default({})).get(airflow_s3_alias, {}) }}"
  no_log: true
  when: airflow_worker_mc_config_stat.stat.exists

- name: Resolve Airflow S3 credentials
  ansible.builtin.set_fact:
    airflow_s3_access_key_resolved: "{{ airflow_s3_access_key if airflow_s3_access_key | length > 0 else (airflow_worker_mc_alias.accessKey | default('')) }}"
    airflow_s3_secret_key_resolved: "{{ airflow_s3_secret_key if airflow_s3_secret_key | length > 0 else (airflow_worker_mc_alias.secretKey | default('')) }}"
  no_log: true

- name: Validate Airflow secrets are available
  ansible.builtin.assert:
    that:
      - airflow_admin_password_resolved | length > 0
      - airflow_fernet_key_resolved | length > 0
      - airflow_secret_key_resolved | length > 0
      - airflow_postgres_password_resolved | length > 0
      - airflow_s3_access_key_resolved | length > 0
      - airflow_s3_secret_key_resolved | length > 0
    fail_msg: "Airflow secrets could not be resolved from protected env vars, existing {{ airflow_env_path }}, generated first-run values, or worker mc config."
    quiet: true
  no_log: true

- name: Ensure Airflow directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('worker') }}"
    group: "{{ item.group | default('worker') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ airflow_project_root }}" }
    - { path: "{{ airflow_dags_root }}" }
    - { path: "{{ airflow_logs_root }}" }
    - { path: "{{ airflow_plugins_root }}" }
    - { path: "{{ airflow_include_root }}" }
    - { path: "{{ airflow_status_root }}" }
    - { path: "{{ airflow_postgres_data_root }}" }
  become: true

- name: Remove local Airflow Python cache directories before copy
  ansible.builtin.command:
    cmd: find "{{ playbook_dir }}/../../airflow" -type d -name __pycache__ -prune -exec rm -rf {} +
  changed_when: false

- name: Copy Airflow DAGs
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../airflow/dags/"
    dest: "{{ airflow_dags_root }}/"
    owner: worker
    group: worker
    mode: preserve
  become: true

- name: Copy Airflow include files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../airflow/include/"
    dest: "{{ airflow_include_root }}/"
    owner: worker
    group: worker
    mode: preserve
  become: true

- name: Copy Airflow plugins
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../airflow/plugins/"
    dest: "{{ airflow_plugins_root }}/"
    owner: worker
    group: worker
    mode: preserve
  become: true

- name: Install Airflow environment file
  ansible.builtin.template:
    src: airflow.env.j2
    dest: "{{ airflow_env_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Install Airflow docker compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ airflow_compose_path }}"
    owner: worker
    group: worker
    mode: "0644"
  become: true

- name: Pull Airflow images
  ansible.builtin.command:
    cmd: docker compose --env-file "{{ airflow_env_path }}" -f "{{ airflow_compose_path }}" pull
  changed_when: true
  become: true

- name: Initialize Airflow metadata database and admin user
  ansible.builtin.command:
    cmd: docker compose --env-file "{{ airflow_env_path }}" -f "{{ airflow_compose_path }}" up airflow-init
  changed_when: true
  become: true

- name: Ensure Airflow writable mounted directories ownership
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ airflow_uid }}"
    group: "0"
    mode: "0775"
    recurse: true
  loop:
    - "{{ airflow_logs_root }}"
    - "{{ airflow_status_root }}"
  become: true

- name: Ensure Airflow can write lightweight MLSystem runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: worker
    group: "0"
    mode: "0775"
    recurse: true
  loop:
    - "{{ mlsystem_data_root }}/mlsystem/storage/system"
    - "{{ mlsystem_data_root }}/mlsystem/artifacts"
    - "{{ mlsystem_data_root }}/mlsystem/logs"
  become: true

- name: Start Airflow services
  ansible.builtin.command:
    cmd: docker compose --env-file "{{ airflow_env_path }}" -f "{{ airflow_compose_path }}" up -d airflow-webserver airflow-scheduler airflow-triggerer
  changed_when: true
  become: true

- name: Wait for Airflow webserver health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ airflow_webserver_port }}/api/v1/health"
    method: GET
    status_code: 200
    return_content: true
    timeout: 10
  register: airflow_health
  retries: 30
  delay: 5
  until: airflow_health.status == 200
  when: airflow_run_health_checks | bool

- name: Ensure Airflow resource pools
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file "{{ airflow_env_path }}" -f "{{ airflow_compose_path }}"
      exec -T airflow-scheduler bash -lc
      'airflow pools set gpu_training "{{ airflow_gpu_slots }}" "GPU-bound MLSystem train/inference stages" &&
       airflow pools set gpu_inference "{{ airflow_gpu_slots }}" "GPU-bound MLSystem inference stages" &&
       airflow pools set cpu_heavy "{{ airflow_cpu_heavy_slots }}" "CPU-heavy MLSystem vectorization/postprocess stages" &&
       airflow pools set cpu_light "{{ airflow_cpu_light_slots }}" "Lightweight MLSystem orchestration stages" &&
       airflow pools set io_light "{{ airflow_io_light_slots }}" "Lightweight S3/MLflow IO stages"'
  changed_when: true
  become: true

- name: Check DAG import list
  ansible.builtin.command:
    cmd: docker compose --env-file "{{ airflow_env_path }}" -f "{{ airflow_compose_path }}" exec -T airflow-scheduler airflow dags list
  register: airflow_dags_list
  changed_when: false
  become: true
  when: airflow_run_health_checks | bool

- name: Trigger smoke DAG run when requested
  ansible.builtin.command:
    cmd: docker compose --env-file "{{ airflow_env_path }}" -f "{{ airflow_compose_path }}" exec -T airflow-scheduler airflow dags trigger mlsystem_smoke_pipeline
  changed_when: true
  become: true
  when: airflow_trigger_smoke | bool

- name: Report Airflow deployment
  ansible.builtin.debug:
    msg:
      ui: "http://127.0.0.1:{{ airflow_webserver_port }}"
      health: "{{ airflow_health.json | default('skipped') }}"
      dags: "{{ airflow_dags_list.stdout_lines | default([]) }}"
