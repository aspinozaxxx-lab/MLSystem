---
- name: Check GPU platform compose file
  ansible.builtin.stat:
    path: "{{ mlsystem_gpu_compose_path }}"
  register: frontend_compose_stat

- name: Check GPU platform env file
  ansible.builtin.stat:
    path: "{{ mlsystem_gpu_env_path }}"
  register: frontend_env_stat

- name: Read existing GPU platform env for frontend
  ansible.builtin.slurp:
    src: "{{ mlsystem_gpu_env_path }}"
  register: frontend_env_file
  when: frontend_env_stat.stat.exists

- name: Parse existing GPU platform env for frontend
  ansible.builtin.set_fact:
    frontend_existing_env: "{{ dict((frontend_env_file.content | b64decode | regex_findall('(?m)^([A-Z0-9_]+)=(.*)$'))) }}"
  when: frontend_env_stat.stat.exists

- name: Resolve frontend settings
  ansible.builtin.set_fact:
    frontend_user_resolved: "{{ lookup('env', 'MLSYSTEM_FRONTEND_USER') | default('', true) or (frontend_existing_env | default({})).get('MLSYSTEM_FRONTEND_USER', mlsystem_gpu_frontend_user) }}"
    frontend_password_resolved: "{{ lookup('env', 'MLSYSTEM_FRONTEND_PASSWORD') | default('', true) or (frontend_existing_env | default({})).get('MLSYSTEM_FRONTEND_PASSWORD', mlsystem_gpu_frontend_default_password) }}"
    frontend_session_secret_resolved: "{{ lookup('env', 'MLSYSTEM_FRONTEND_SESSION_SECRET') | default('', true) or (frontend_existing_env | default({})).get('MLSYSTEM_FRONTEND_SESSION_SECRET', lookup('password', '/dev/null length=48 chars=ascii_letters,digits')) }}"
    frontend_rabbitmq_proxy_basic_auth: "{{ (frontend_existing_env | default({})).get('RABBITMQ_MANAGEMENT_PROXY_AUTH', '') or (((frontend_existing_env | default({})).get('RABBITMQ_DEFAULT_USER', 'mlsystem') ~ ':' ~ (frontend_existing_env | default({})).get('RABBITMQ_DEFAULT_PASS', '')) | b64encode) }}"
    frontend_bucket_resolved: "{{ (frontend_existing_env | default({})).get('MLSYSTEM_BUCKET', 'mlsystems') }}"
    minio_images_console_user_resolved: "{{ lookup('env', 'MINIO_IMAGES_CONSOLE_USER') | default('', true) or (frontend_existing_env | default({})).get('MINIO_IMAGES_CONSOLE_USER', mlsystem_gpu_minio_images_console_user) }}"
    minio_images_console_password_resolved: "{{ lookup('env', 'MINIO_IMAGES_CONSOLE_PASSWORD') | default('', true) or (frontend_existing_env | default({})).get('MINIO_IMAGES_CONSOLE_PASSWORD', lookup('password', '/dev/null length=32 chars=ascii_letters,digits')) }}"
    minio_images_console_policy_resolved: "{{ (frontend_existing_env | default({})).get('MINIO_IMAGES_CONSOLE_POLICY', mlsystem_gpu_minio_images_console_policy) }}"
    kanopus_reader_user_resolved: "{{ (frontend_existing_env | default({})).get('MINIO_KANOPUS_READER_USER', mlsystem_gpu_minio_kanopus_reader_user) }}"
    kanopus_reader_policy_resolved: "{{ (frontend_existing_env | default({})).get('MINIO_KANOPUS_READER_POLICY', mlsystem_gpu_minio_kanopus_reader_policy) }}"
    kanopus_reader_legacy_policy_resolved: "{{ (frontend_existing_env | default({})).get('MINIO_KANOPUS_READER_LEGACY_POLICY', mlsystem_gpu_minio_kanopus_reader_legacy_policy) }}"
  no_log: true

- name: Ensure frontend upload directory exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0775"
  loop:
    - "{{ mlsystem_gpu_data_root }}/frontend/uploads"
    - "{{ mlsystem_gpu_data_root }}/frontend/training_report"
    - "{{ mlsystem_gpu_data_root }}/tuning"

- name: Check UFW status for frontend proxy
  ansible.builtin.command:
    cmd: ufw status
  register: frontend_ufw_status
  changed_when: false
  failed_when: false

- name: Allow frontend HTTP proxy in UFW
  ansible.builtin.command:
    cmd: "ufw allow {{ mlsystem_gpu_frontend_proxy_port }}/tcp"
  register: frontend_ufw_allow
  changed_when: "'Skipping' not in frontend_ufw_allow.stdout"
  when:
    - frontend_ufw_status.rc == 0
    - "'Status: active' in frontend_ufw_status.stdout"

- name: Install frontend reverse proxy config
  ansible.builtin.template:
    src: frontend-nginx.conf.j2
    dest: "{{ mlsystem_gpu_platform_root }}/frontend-nginx.conf"
    owner: root
    group: root
    mode: "0644"

- name: Ensure frontend env values are present
  ansible.builtin.lineinfile:
    path: "{{ mlsystem_gpu_env_path }}"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: false
    mode: "0600"
  loop:
    - { key: "MLSYSTEM_PLATFORM_ROOT", value: "{{ mlsystem_gpu_platform_root }}" }
    - { key: "MLSYSTEM_FRONTEND_PORT", value: "{{ mlsystem_gpu_frontend_port }}" }
    - { key: "MLSYSTEM_FRONTEND_PUBLIC_BASE_URL", value: "{{ mlsystem_gpu_frontend_public_url }}" }
    - { key: "MLSYSTEM_FRONTEND_COOKIE_SECURE", value: "{{ mlsystem_gpu_frontend_cookie_secure }}" }
    - { key: "MLSYSTEM_FRONTEND_ALLOWED_HOSTS", value: "{{ mlsystem_gpu_frontend_allowed_hosts }}" }
    - { key: "MLSYSTEM_FRONTEND_PROXY_LISTEN_HOST", value: "{{ mlsystem_gpu_frontend_proxy_listen_host }}" }
    - { key: "MLSYSTEM_FRONTEND_PROXY_PORT", value: "{{ mlsystem_gpu_frontend_proxy_port }}" }
    - { key: "MLSYSTEM_FRONTEND_USER", value: "{{ frontend_user_resolved }}" }
    - { key: "MLSYSTEM_FRONTEND_PASSWORD", value: "{{ frontend_password_resolved }}" }
    - { key: "MLSYSTEM_FRONTEND_SESSION_SECRET", value: "{{ frontend_session_secret_resolved }}" }
    - { key: "MLSYSTEM_FRONTEND_SESSION_COOKIE_NAME", value: "mlsystem_session" }
    - { key: "MLSYSTEM_FRONTEND_SESSION_TTL_SECONDS", value: "28800" }
    - { key: "MLSYSTEM_FRONTEND_UPLOAD_ROOT", value: "/data/mlsystem/frontend/uploads" }
    - { key: "MLSYSTEM_FRONTEND_TRAINING_REPORT_ROOT", value: "/data/mlsystem/frontend/training_report" }
    - { key: "MLSYSTEM_TUNING_ROOT", value: "/data/mlsystem/tuning" }
    - { key: "MLSYSTEM_RUN_ROOT", value: "/data/mlsystem/runs" }
    - { key: "MLSYSTEM_MLMARKUP_REPO_PATH", value: "/data/MLMarkup" }
    - { key: "MLSYSTEM_API_BASE_URL", value: "http://mlsystem-api:8088" }
    - { key: "MLSYSTEM_FRONTEND_DEFAULT_IMAGES_URI", value: "{{ mlsystem_gpu_frontend_default_images_uri }}" }
    - { key: "MLSYSTEM_FRONTEND_DEFAULT_LAYOUT_URI", value: "{{ mlsystem_gpu_frontend_default_layout_uri }}" }
    - { key: "MLSYSTEM_FRONTEND_DEFAULT_SPLIT_STRATEGY", value: "{{ mlsystem_gpu_frontend_default_split_strategy }}" }
    - { key: "MLSYSTEM_FRONTEND_MAX_UPLOAD_MB", value: "{{ mlsystem_gpu_frontend_max_upload_mb }}" }
    - { key: "MLSYSTEM_FRONTEND_S3_PREFIX", value: "frontend-checks" }
    - { key: "MINIO_BROWSER_REDIRECT_URL", value: "{{ mlsystem_gpu_frontend_public_url }}/minio/" }
    - { key: "MINIO_IMAGES_CONSOLE_USER", value: "{{ minio_images_console_user_resolved }}" }
    - { key: "MINIO_IMAGES_CONSOLE_PASSWORD", value: "{{ minio_images_console_password_resolved }}" }
    - { key: "MINIO_IMAGES_CONSOLE_POLICY", value: "{{ minio_images_console_policy_resolved }}" }
    - { key: "MINIO_KANOPUS_READER_USER", value: "{{ kanopus_reader_user_resolved }}" }
    - { key: "MINIO_KANOPUS_READER_POLICY", value: "{{ kanopus_reader_policy_resolved }}" }
    - { key: "MINIO_KANOPUS_READER_LEGACY_POLICY", value: "{{ kanopus_reader_legacy_policy_resolved }}" }
    - { key: "FRONTEND_MLFLOW_UI_URL", value: "/mlflow/" }
    - { key: "FRONTEND_MINIO_UI_URL", value: "/minio/browser/{{ frontend_bucket_resolved }}/images/" }
    - { key: "FRONTEND_RABBITMQ_MANAGEMENT_URL", value: "/rabbitmq/" }
    - { key: "FRONTEND_GRAFANA_URL", value: "/grafana/" }
    - { key: "FRONTEND_PROMETHEUS_URL", value: "/prometheus/" }
    - { key: "FRONTEND_JUPYTER_URL", value: "/jupyter/" }
    - { key: "FRONTEND_GRAFANA_MAIN_DASHBOARD_URL", value: "/grafana/d/mlsystem-overview/mlsystem-overview?orgId=1&kiosk" }
    - { key: "RABBITMQ_MANAGEMENT_PUBLIC_URL", value: "/rabbitmq/" }
  when: frontend_env_stat.stat.exists
  no_log: true

- name: Ensure MinIO Console images reader policy
  ansible.builtin.shell: |
    set -eu
    docker compose --env-file "{{ mlsystem_gpu_env_path }}" -f "{{ mlsystem_gpu_compose_path }}" exec -T \
      -e MLSYSTEM_BUCKET="$MLSYSTEM_BUCKET" \
      -e MINIO_IMAGES_CONSOLE_USER="$MINIO_IMAGES_CONSOLE_USER" \
      -e MINIO_IMAGES_CONSOLE_PASSWORD="$MINIO_IMAGES_CONSOLE_PASSWORD" \
      -e MINIO_IMAGES_CONSOLE_POLICY="$MINIO_IMAGES_CONSOLE_POLICY" \
      minio sh -s <<'MINIO_SCRIPT'
    set -eu
    mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
    cat > /tmp/mlsystem-images-readonly.json <<EOF
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation"],
          "Resource": ["arn:aws:s3:::${MLSYSTEM_BUCKET}"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:ListBucket"],
          "Resource": ["arn:aws:s3:::${MLSYSTEM_BUCKET}"],
          "Condition": {
            "StringLike": {
              "s3:prefix": ["images", "images/", "images/*"]
            }
          }
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject"],
          "Resource": ["arn:aws:s3:::${MLSYSTEM_BUCKET}/images/*"]
        }
      ]
    }
    EOF
    mc admin policy create local "$MINIO_IMAGES_CONSOLE_POLICY" /tmp/mlsystem-images-readonly.json >/dev/null 2>&1 || true
    mc admin user add local "$MINIO_IMAGES_CONSOLE_USER" "$MINIO_IMAGES_CONSOLE_PASSWORD" >/dev/null 2>&1 || true
    mc admin user enable local "$MINIO_IMAGES_CONSOLE_USER" >/dev/null 2>&1 || true
    mc admin policy attach local "$MINIO_IMAGES_CONSOLE_POLICY" --user "$MINIO_IMAGES_CONSOLE_USER" >/dev/null 2>&1 || true
    MINIO_SCRIPT
  args:
    executable: /bin/bash
  environment:
    MLSYSTEM_BUCKET: "{{ frontend_bucket_resolved }}"
    MINIO_IMAGES_CONSOLE_USER: "{{ minio_images_console_user_resolved }}"
    MINIO_IMAGES_CONSOLE_PASSWORD: "{{ minio_images_console_password_resolved }}"
    MINIO_IMAGES_CONSOLE_POLICY: "{{ minio_images_console_policy_resolved }}"
  when:
    - frontend_compose_stat.stat.exists
    - frontend_env_stat.stat.exists
  no_log: true

- name: Ensure kanopus-reader images incoming write policy
  ansible.builtin.shell: |
    set -eu
    docker compose --env-file "{{ mlsystem_gpu_env_path }}" -f "{{ mlsystem_gpu_compose_path }}" exec -T \
      -e MLSYSTEM_BUCKET="$MLSYSTEM_BUCKET" \
      -e MINIO_KANOPUS_READER_USER="$MINIO_KANOPUS_READER_USER" \
      -e MINIO_KANOPUS_READER_POLICY="$MINIO_KANOPUS_READER_POLICY" \
      -e MINIO_KANOPUS_READER_LEGACY_POLICY="$MINIO_KANOPUS_READER_LEGACY_POLICY" \
      minio sh -s <<'MINIO_SCRIPT'
    set -eu
    mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
    cat > /tmp/kanopus-reader-images-access.json <<EOF
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:ListAllMyBuckets"],
          "Resource": ["arn:aws:s3:::*"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation"],
          "Resource": ["arn:aws:s3:::${MLSYSTEM_BUCKET}"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:ListBucket", "s3:ListBucketMultipartUploads"],
          "Resource": ["arn:aws:s3:::${MLSYSTEM_BUCKET}"],
          "Condition": {
            "StringLike": {
              "s3:prefix": [
                "",
                "images",
                "images/",
                "images/kanopus",
                "images/kanopus/",
                "images/kanopus/*",
                "images/incoming",
                "images/incoming/",
                "images/incoming/*"
              ]
            }
          }
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject"],
          "Resource": [
            "arn:aws:s3:::${MLSYSTEM_BUCKET}/images/kanopus/*",
            "arn:aws:s3:::${MLSYSTEM_BUCKET}/images/incoming/*"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:AbortMultipartUpload",
            "s3:ListMultipartUploadParts"
          ],
          "Resource": ["arn:aws:s3:::${MLSYSTEM_BUCKET}/images/incoming/*"]
        }
      ]
    }
    EOF
    mc admin user info local "$MINIO_KANOPUS_READER_USER" >/dev/null
    mc admin policy detach local "$MINIO_KANOPUS_READER_LEGACY_POLICY" --user "$MINIO_KANOPUS_READER_USER" >/dev/null 2>&1 || true
    mc admin policy detach local "$MINIO_KANOPUS_READER_POLICY" --user "$MINIO_KANOPUS_READER_USER" >/dev/null 2>&1 || true
    mc admin policy rm local "$MINIO_KANOPUS_READER_POLICY" >/dev/null 2>&1 || true
    mc admin policy create local "$MINIO_KANOPUS_READER_POLICY" /tmp/kanopus-reader-images-access.json >/dev/null
    mc admin policy attach local "$MINIO_KANOPUS_READER_POLICY" --user "$MINIO_KANOPUS_READER_USER" >/dev/null
    MINIO_SCRIPT
  args:
    executable: /bin/bash
  environment:
    MLSYSTEM_BUCKET: "{{ frontend_bucket_resolved }}"
    MINIO_KANOPUS_READER_USER: "{{ kanopus_reader_user_resolved }}"
    MINIO_KANOPUS_READER_POLICY: "{{ kanopus_reader_policy_resolved }}"
    MINIO_KANOPUS_READER_LEGACY_POLICY: "{{ kanopus_reader_legacy_policy_resolved }}"
  when:
    - frontend_compose_stat.stat.exists
    - frontend_env_stat.stat.exists
  no_log: true

- name: Deploy MLSystem frontend container
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file "{{ mlsystem_gpu_env_path }}"
      -f "{{ mlsystem_gpu_compose_path }}"
      up -d --build --force-recreate --no-deps mlsystem-frontend mlsystem-frontend-proxy
  changed_when: true
  when:
    - frontend_compose_stat.stat.exists
    - frontend_env_stat.stat.exists

- name: Wait for MLSystem frontend health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ mlsystem_gpu_frontend_port }}/health"
    status_code: 200
  retries: 30
  delay: 5
  register: frontend_health
  until: frontend_health.status == 200
  when:
    - frontend_compose_stat.stat.exists
    - frontend_env_stat.stat.exists

- name: Wait for MLSystem frontend public proxy health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ mlsystem_gpu_frontend_proxy_port }}/health"
    status_code: 200
  retries: 30
  delay: 5
  register: frontend_proxy_health
  until: frontend_proxy_health.status == 200
  when:
    - frontend_compose_stat.stat.exists
    - frontend_env_stat.stat.exists
