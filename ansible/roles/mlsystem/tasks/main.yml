---
- name: Ensure MLSystem root and runtime directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ mlsystem_root }}"
    - "{{ mlsystem_root }}/logs"
    - "{{ mlsystem_root }}/storage/images"
    - "{{ mlsystem_root }}/storage/layouts"
    - "{{ mlsystem_root }}/storage/jobs/pending"
    - "{{ mlsystem_root }}/storage/jobs/running"
    - "{{ mlsystem_root }}/storage/jobs/done"
    - "{{ mlsystem_root }}/storage/jobs/failed"
    - "{{ mlsystem_root }}/storage/cache"
    - "{{ mlsystem_root }}/storage/experiments"
    - "{{ mlsystem_root }}/storage/system"

- name: Ensure MLSystem system config directory exists
  ansible.builtin.file:
    path: /etc/mlsystem
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: mlsystem_deploy_infra | bool

- name: Copy lightweight MLSystem project
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../mlsystem/"
    dest: "{{ mlsystem_root }}/"
    mode: preserve
  when: mlsystem_deploy_code | bool

- name: Install non-secret runtime environment file
  ansible.builtin.template:
    src: mlsystem.env.j2
    dest: /etc/mlsystem/mlsystem.env
    owner: root
    group: root
    mode: "0644"
  become: true
  when: mlsystem_deploy_infra | bool

- name: Check training venv exists
  ansible.builtin.stat:
    path: "{{ mlsystem_venv }}/bin/python"
  register: mlsystem_venv_python

- name: Stop if expected training venv is missing
  ansible.builtin.fail:
    msg: "Expected Python venv is missing: {{ mlsystem_venv }}"
  when: not mlsystem_venv_python.stat.exists

- name: Check local lightweight storage size
  ansible.builtin.shell: |
    set -e
    du -sm "{{ mlsystem_root }}/storage/images" "{{ mlsystem_root }}/storage/layouts" "{{ mlsystem_root }}/storage/cache" | awk '{sum += $1} END {print sum + 0}'
  register: mlsystem_local_storage_du
  changed_when: false

- name: Assert local heavy storage folders remain lightweight
  ansible.builtin.assert:
    that:
      - (mlsystem_local_storage_du.stdout | int) <= mlsystem_local_heavy_storage_max_mb
    fail_msg: "Local images/layouts/cache exceed {{ mlsystem_local_heavy_storage_max_mb }} MB. Heavy data must stay in S3/MinIO, not root disk."
    success_msg: "Local images/layouts/cache are lightweight."

- name: Install systemd unit for executor
  ansible.builtin.template:
    src: mlsystem-executor.service.j2
    dest: /etc/systemd/system/mlsystem-executor.service
    mode: "0644"
  become: true
  when: mlsystem_deploy_infra | bool

- name: Install systemd unit for web API
  ansible.builtin.template:
    src: mlsystem-web.service.j2
    dest: /etc/systemd/system/mlsystem-web.service
    mode: "0644"
  become: true
  when: mlsystem_deploy_infra | bool

- name: Install systemd unit for S3 preprocess daemon
  ansible.builtin.template:
    src: mlsystem-preprocess.service.j2
    dest: /etc/systemd/system/mlsystem-preprocess.service
    mode: "0644"
  become: true
  when: mlsystem_deploy_infra | bool

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: mlsystem_deploy_infra | bool

- name: Check managed MLSystem unit files
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop:
    - mlsystem-web.service
    - mlsystem-executor.service
    - mlsystem-preprocess.service
  register: mlsystem_unit_files
  become: true

- name: Restart managed MLSystem services when enabled
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: restarted
    enabled: true
  loop: "{{ mlsystem_unit_files.results }}"
  become: true
  when:
    - mlsystem_manage_services | bool
    - item.stat.exists

- name: Check MLflow endpoint
  ansible.builtin.uri:
    url: "{{ mlsystem_mlflow_uri }}"
    method: GET
    status_code: [200, 302, 404]
    timeout: 5
  register: mlsystem_mlflow_check
  when: mlsystem_run_health_checks | bool

- name: Check MinIO endpoint
  ansible.builtin.uri:
    url: "{{ mlsystem_minio_health_uri }}"
    method: GET
    status_code: [200, 403]
    timeout: 5
  register: mlsystem_minio_check
  when: mlsystem_run_health_checks | bool

- name: Check MLSystem web API state endpoint
  ansible.builtin.uri:
    url: "{{ mlsystem_web_state_uri }}"
    method: GET
    status_code: 200
    return_content: true
    timeout: 10
  register: mlsystem_web_check
  retries: 6
  delay: 2
  until: mlsystem_web_check.status == 200
  when:
    - mlsystem_run_health_checks | bool
    - mlsystem_manage_services | bool

- name: Check whether deployed web API supports preprocess endpoint
  ansible.builtin.command:
    cmd: "grep -q 'api_preprocess' {{ mlsystem_root }}/src/web_app.py"
  register: mlsystem_web_supports_preprocess
  changed_when: false
  failed_when: false
  when: mlsystem_run_health_checks | bool

- name: Check MLSystem preprocess API endpoint
  ansible.builtin.uri:
    url: "{{ mlsystem_web_preprocess_uri }}"
    method: GET
    status_code: 200
    return_content: true
    timeout: 10
  register: mlsystem_preprocess_check
  retries: 6
  delay: 2
  until: mlsystem_preprocess_check.status == 200
  when:
    - mlsystem_run_health_checks | bool
    - mlsystem_manage_services | bool
    - mlsystem_web_supports_preprocess.rc | default(1) == 0

- name: Run safe preprocess dry-run check
  ansible.builtin.command:
    cmd: "{{ mlsystem_venv }}/bin/python -m src.cli preprocess-once --dry-run"
    chdir: "{{ mlsystem_root }}"
  register: mlsystem_preprocess_dry_run
  changed_when: false
  when: mlsystem_run_health_checks | bool

- name: Report MLSystem health checks
  ansible.builtin.debug:
    msg:
      mlflow_status: "{{ mlsystem_mlflow_check.status | default('skipped') }}"
      minio_status: "{{ mlsystem_minio_check.status | default('skipped') }}"
      web_state: "{{ mlsystem_web_check.json | default('skipped') }}"
      preprocess_api: "{{ mlsystem_preprocess_check.json | default('skipped') }}"
  when: mlsystem_run_health_checks | bool
